[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparkcontrol"
version = "1.0.0"
description = "Spark Control gateway — one-tap mobile start/stop for the DGX Spark inference cluster"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sparkcontrol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency injection uses args without defaults

[tool.mypy]
python_version = "3.11"
strict = true
